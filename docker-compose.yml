services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: pid-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./src/bridge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  kafka:
    image: apache/kafka:3.8.0
    container_name: pid-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    mem_limit: 1024m

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: pid-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC:-campus-telemetry} --partitions 4 --replication-factor 1
        echo "Kafka topic ready."
    restart: "no"
    mem_limit: 256m

  mysql:
    image: mysql:8.0
    container_name: pid-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_master}
      MYSQL_USER: ${MYSQL_USER:-pid_mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pid_mysql_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/sql/mysql/01_master_schema.sql:/docker-entrypoint-initdb.d/01_master_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mysql_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  mongodb:
    image: mongo:7.0
    container_name: pid-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  postgres:
    image: postgres:16-alpine
    container_name: pid-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pid_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-campus_telemetry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/sql/postgres/01_init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pid_user} -d ${POSTGRES_DB:-campus_telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  simulator:
    build:
      context: .
      dockerfile: src/simulator/Dockerfile
    container_name: pid-simulator
    depends_on:
      mosquitto:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-campus_raw}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_telemetry}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_INTERVAL_SEC: ${SIM_INTERVAL_SEC:-1.0}
      SIM_BACKFILL_DAYS: ${SIM_BACKFILL_DAYS:-7}
      SIM_DIRTY_RATE: ${SIM_DIRTY_RATE:-0.05}
      FLASH_CROWD_EVERY_MIN: ${FLASH_CROWD_EVERY_MIN:-20}
      FLASH_CROWD_DURATION_MIN: ${FLASH_CROWD_DURATION_MIN:-5}
      SIM_LEDGER_PATH: ${SIM_LEDGER_PATH:-/shared/ledger/injection_ledger.jsonl}
    volumes:
      - shared_ledger:/shared/ledger
    mem_limit: 256m

  bridge:
    build:
      context: .
      dockerfile: src/bridge/Dockerfile
    container_name: pid-bridge
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC:-campus/telemetry/#}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-campus-telemetry}
    mem_limit: 256m

  mongo-consumer:
    build:
      context: .
      dockerfile: src/bridge/Dockerfile
    container_name: pid-mongo-consumer
    command: ["python", "-m", "src.bridge.kafka_to_mongo"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-campus-telemetry}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-campus_raw}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_telemetry}
    mem_limit: 256m

  spark-streaming:
    build:
      context: .
      dockerfile: src/spark/Dockerfile
    container_name: pid-spark-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-campus-telemetry}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-campus_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-pid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pid_secret_password}
    mem_limit: 1536m

  airflow-init:
    build:
      context: .
      dockerfile: src/dags/Dockerfile
    container_name: pid-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-pid_user}:${POSTGRES_PASSWORD:-pid_secret_password}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname PID --role Admin --email admin@campus.ac.id || true
    restart: "no"
    mem_limit: 768m

  airflow:
    build:
      context: .
      dockerfile: src/dags/Dockerfile
    container_name: pid-airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-pid_user}:${POSTGRES_PASSWORD:-pid_secret_password}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      AIRFLOW__WEBSERVER__SECRET_KEY: pid-campus-telemetry-secret
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-campus_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-pid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pid_secret_password}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_master}
      MYSQL_USER: ${MYSQL_USER:-pid_mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pid_mysql_secret}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-campus_raw}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_telemetry}
      SIM_LEDGER_PATH: ${SIM_LEDGER_PATH:-/shared/ledger/injection_ledger.jsonl}
    volumes:
      - shared_ledger:/shared/ledger:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        (sleep 20 && airflow dags unpause campus_telemetry_etl && airflow dags trigger campus_telemetry_etl) &
        airflow scheduler &
        exec airflow webserver -p 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    mem_limit: 1536m

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pid-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      POSTGRES_USER: ${POSTGRES_USER:-pid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pid_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-campus_telemetry}
    volumes:
      - ./src/dashboard/provisioning:/etc/grafana/provisioning:ro
      - ./src/dashboard/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m

volumes:
  mysql_data:
  mongo_data:
  postgres_data:
  shared_ledger:
